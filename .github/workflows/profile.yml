name: profile
on:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [main]
    paths:
      - README.md
      - bin/gen-profile.sh
      - .github/workflows/profile.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate profile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/gen-profile.sh
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore(profile): refresh generated sections"
          git push
